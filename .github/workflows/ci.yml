name: CI

on:
  push:
  pull_request:

jobs:
  core-api:
    name: Java core API (build + JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travelops-core-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # verify compiles, runs every JUnit test and packages the jar; any failing test fails the job.
      - run: ./mvnw -B verify

  analytics-api:
    name: Python analytics API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travelops-analytics-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: travelops-analytics-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
